---
###############################
# (ㄱ) 방화벽 포트 제거
# (ㄴ) 서비스 종료
# (ㄷ) 서비스 설정 삭제
# (ㄹ) 패키지 삭제
###############################

- name: 복원 작업
  hosts: webservers
  tasks:    
    - name: 1) 방화벽 포트 제거 - mysql, http, https
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        immediate: true
        state: disabled
      loop:
        - http
        - https
        - mysql

    - name: 2) 서비스 종료 - mariadb, httpd, firewalld
      ansible.builtin.systemd_service:
        state: stopped
        name: "{{ item }}"
        enabled: true
      loop:
        - httpd
        - firewalld
        - mariadb

    - name: 3) 서비스 설정 삭제 - /var/www/html/index.php
      ansible.builtin.file:
        path: /var/www/html/index.php
        state: absent

    - name: 4) 패키지 삭제 - httpd, mod_ssl, php, php-mysqlnd, php-pdo, mariadb-server, mariadb
      ansible.builtin.dnf:
        name:
          - httpd
          - mod_ssl
          - php
          - php-mysqlnd
          - php-pdo
          - mariadb-server
          - mariadb
          - python3-PyMySQL
          - mariadb-connector-c-config
          - mariadb-common
          - mariadb-connector-c
          - mariadb-errmsg
        state: absent

