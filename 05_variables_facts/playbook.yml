---
########################################
# Play 01: .htaccess 파일 사용하는 웹서버 구축
# * (ㄱ) 패키지 설치 - httpd, firewalld, mod_ssl
# * (ㄴ) 서비스 설정
#   - /etc/httpd/conf/httpd.conf(AllowOveride AuthConfig)
#   - /var/www/html/.htaccess
#   - /etc/httpd/secrets/htpasswd
#   - /var/www/html/index.html
# * (ㄷ) 서비스 기동 - httpd, firewalld
# * (ㄹ) 방화벽 등록 - http, https
# Play 02: 웹 요청
########################################

#
# Play 01: .htaccess 파일 사용하는 웹서버 구축
#
- name: Play 01 - .htaccess 파일 사용하는 웹서버 구축
  hosts: all
  vars: 
    fw_pkg: firewalld
    web_pkg: httpd
    ssl_pkg: mod_ssl
    fw_svc: firewalld
    web_svc: httpd
    http_src: files/httpd.conf
    http_dest: /etc/httpd/conf/httpd.conf
    hta_src: files/.htaccess
    hta_dest: /var/www/html/.htaccess
    htpw_src: files/htpasswd
    htpw_dest: /etc/httpd/secrets/htpasswd
    secrets_dir: /etc/httpd/secrets
  tasks:
    - name: 1) 패키지 설치
      ansible.builtin.dnf:
        name: "{{ item }}"
        state: present
      loop: 
        - "{{ fw_pkg }}"
        - "{{ web_pkg }}"
        - "{{ ssl_pkg }}"

# * (ㄴ) 서비스 설정
#   - /etc/httpd/conf/httpd.conf(AllowOveride AuthConfig)
#   - /var/www/html/.htaccess
#   - /etc/httpd/secrets/htpasswd
#   - /var/www/html/index.html
    - name: 2) 서비스 설정 - /etc/httpd/conf/httpd.conf(AllowOveride AuthConfig)
      ansible.builtin.copy:
        src: "{{ http_src }}"
        dest: "{{ http_dest }}"
        owner: root
        group: root
        mode: '0644'

    - name: 2) 서비스 설정 - /var/www/html/.htaccess
      ansible.builtin.copy:
        src: "{{ hta_src }}"
        dest: "{{ hta_dest }}"
        owner: root
        group: root
        mode: '0400'

    - name: 2) 서비스 설정 - /etc/httpd/secrets
      ansible.builtin.file:
        path: "{{ secrets_dir }}"
        state: directory
        mode: '0400'

    - name: 2) 서비스 설정 - /etc/httpd/secrets/htpasswd
      ansible.builtin.copy:
        src: "{{ htpw_src }}"
        dest: "{{ htpw_dest }}"
        owner: root
        group: root
        mode: '0400'

    - name: 2) 서비스 설정 - /var/www/html/index.html
      ansible.builtin.copy:
        content: |
          <pre>
          Hostname - {{ ansible_fqdn }}
          Hostname - {{ ansible_facts["fqdn"] }}
          IP - {{ ansible_default_ipv4.address }}
          IP - {{ ansible_facts["default_ipv4"]["address"] }}
          IP - {{ ansible_facts.default_ipv4.address }}
          </pre>
        dest: "{{ web_root }}/index.html"
        mode: '0644'

    - name: 3) 서비스 기동
      # * firealld
      # * httpd
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - "{{ fw_svc }}"
        - "{{ web_svc }}"

    - name: 4) 방화벽 포트 등록
      # * http
      # * https
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - http
        - https

- name: Play 01) 웹 요청 with 인증
  hosts: localhost
  become: false
  gather_facts: false
  vars_files:
    - vars/secret.yml
  tasks:
    ########################
    # $ cat vars/secret.yml
    # id: guest
    # pass: soldesk1.
    # $ ansible-vault encrypt vars/secret.yml
    # $ vi playbook.yml
    # $ ansible-playbook playbook --vault-id=@prompt
    #########################
    - name: 1) 웹 요청 with 사용자 인증
      ansible.builtin.uri:
        url: http://ansible1.example.com
        validate_certs: false
        return_content: true
        user: "{{ id }}"
        password: "{{ pass }}"
        force_basic_auth: true
        status_code: 200
      register: web_output

    - name: 2) 웹 출력 확인
      ansible.builtin.debug:
        var: web_output.content

      

