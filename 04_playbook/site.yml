---
- name: 0) 웹서버 설정
  hosts: webservers
#- hosts: web1.example.com:web2.example.com:web3.example.com

##################################################
# (ㄱ) 패키지 설치
# yum install httpd
# (ㄴ) 서비스 설정
# cp files/index.html /var/www/html/index.html
# (ㄷ) 서비스 기동
# systemctl enable --now httpd
# (ㄹ) 방화벽 기동 및 등록
# firewall-cmd --permanent --add-service=http
# firewall-cmd --reload
##################################################
  tasks: 
    - name: 1) 패키지 설치 
      ansible.builtin.dnf:
        name: httpd
        state: present
    - name: 2) 웹 서버 설정 
      ansible.builtin.copy:
        content: 'My WEB Server\n'
        dest: /var/www/html/index.html
    - name: 3) 웹 서비스 기동
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true
    - name: 4) 방화벽 등록
      ansible.posix.firewalld:
        service: http
        state: enabled
        permanent: true
        immediate: true

